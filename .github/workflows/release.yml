# Release builds: terminal version for Linux, Windows and macOS.
# Runs only on a version tag (git tag v1.0 && git push origin v1.0) or by hand.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GAME: larn
  BUILD: sh build-term.sh
  FILES: larnfiles/* README.md docs

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runs-on: ubuntu-latest, make: '' }
          - { os: windows, runs-on: ubuntu-latest, make: 'CC=x86_64-w64-mingw32-gcc EXE=.exe TLIBS=-static' }
          - { os: macos, runs-on: macos-latest, make: 'CC=clang EXTRA="-arch arm64 -arch x86_64"' }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: ${{ env.BUILD }} ${{ matrix.make }}
      - name: package
        shell: bash
        run: |
          d=$GAME-${{ matrix.os }}
          mkdir $d
          cp $GAME-term* $d/
          for f in $FILES; do [ -e "$f" ] && cp -r "$f" $d/; done
          if [ ${{ matrix.os }} = windows ]; then zip -qr $d.zip $d; else tar czf $d.tar.gz $d; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME }}-${{ matrix.os }}
          path: ${{ env.GAME }}-${{ matrix.os }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.GAME }}-*
